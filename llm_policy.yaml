# Политика отправки данных в модель. По умолчанию ничего не режется и не маскируется.
#
# Переключение без правки кода:
#   active: bank_redact
#   или переменная окружения PGPROFILE_LLM_POLICY=bank_redact
#
# sanitization: false  — allow/deny/mask игнорируются (профиль как черновик).
# sanitization: true   — секции фильтруются, затем regex-маски применяются к тексту.

active: none

policies:
  none:
    sanitization: false
    allow_sections: []
    deny_sections: []
    mask: []

  # Образец для банковского контура: не уходит findings (там часто SQL),
  # IP/пароли/email маскируются. Включение: PGPROFILE_LLM_POLICY=bank_redact
  bank_redact:
    sanitization: true
    allow_sections: []
    deny_sections:
      - findings
    mask:
      - name: ipv4
        pattern: '\b(?:\d{1,3}\.){3}\d{1,3}\b'
        replacement: "<ip>"
      - name: secret
        pattern: '(?i)\b(password|passwd|secret|token)\s*[=:]\s*\S+'
        replacement: '\1=<redacted>'
      - name: email
        pattern: '\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b'
        replacement: "<email>"
